        transition: 0.3s;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 20px #ffd00022;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        background: linear-gradient(135deg, #ffe066, #ffb300);
        -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        opacity: 0;
        transition: 0.35s;
    }

    .card:hover::before {
        opacity: 1;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 0 25px #ffcc0055;
    }

    .card h3 {
        color: #ffd000;
        margin-bottom: 10px;
        font-size: 24px;
        text-shadow: 0 0 10px #ffcc00;
    }
