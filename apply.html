
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Commission Request Form</title>
<style>
    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
    }
    .container {
        width: 500px;
        margin: auto;
        background: #1a1a1a;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    label {
        font-weight: bold;
        margin-top: 10px;
        display: block;
    }
    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        background: #111;
        border: 1px solid #444;
        border-radius: 8px;
        color: white;
    }
    button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #4e8cff;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover {
        background: #3b6fcc;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Commission Request</h1>

    <form action="https://YOURSERVER.com/submit" method="POST">
        <label>Your Name</label>
        <input type="text" name="name" required>

        <label>Discord Username</label>
        <input type="text" name="discord" required>

        <label>Roblox Username</label>
        <input type="text" name="roblox" required>

        <label>Proof of Payment (POP) — link or transaction ID</label>
        <input type="text" name="pop" required>

        <label>The Job</label>
        <textarea name="job" required rows="3"></textarea>

        <label>Payment Amount</label>
        <input type="text" name="payment" required>

        <label>Type</label>
        <select name="type">
            <option value="Subscription">Subscription</option>
            <option value="Commission">Commission</option>
        </select>

        <button type="submit">Submit Request</button>
    </form>
</div>

</body>
</html>
